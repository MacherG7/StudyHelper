# XcodeGen spec for StudyHelper. Generate the project with scripts/bootstrap.sh.
# The generated StudyHelper.xcodeproj is not committed (see docs/DECISIONS.md).
name: StudyHelper

options:
  bundleIdPrefix: MiloG
  developmentLanguage: de
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Team of the Xcode account <Apple-ID> (free Personal Team); IDs end in 1 (see CLAUDE.md).
    DEVELOPMENT_TEAM: RL9PPXX5GV
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # App version A.B.C.D shown in the settings: A.B.C = MARKETING_VERSION, D = build. Raise D with
    # scripts/bump-version.sh before every commit (D-027).
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

packages:
  StudyHelperCore:
    path: Packages/StudyHelperCore

targets:
  StudyHelper:
    type: application
    platform: iOS
    sources:
      - path: StudyHelper
    dependencies:
      - package: StudyHelperCore
        product: StudyCore
      - package: StudyHelperCore
        product: StudyImport
      - package: StudyHelperCore
        product: StudyData
    info:
      path: StudyHelper/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # "Öffnen in StudyHelper" for PDFs (replaces the share extension, see docs/DECISIONS.md D-013).
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF-Dokument
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        LSSupportsOpeningDocumentsInPlace: false
        NSCameraUsageDescription: StudyHelper nutzt die Kamera, um Buchseiten und Notizen als Lernstoff zu fotografieren oder zu scannen.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: MiloG.StudyHelper1
        PRODUCT_NAME: StudyHelper
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StudyHelper
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        # The commit phase below reads the git repository, which the script sandbox does not allow (D-029).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Commit in Info.plist eintragen
        script: '"$SRCROOT/scripts/embed-commit.sh"'
        basedOnDependencyAnalysis: false

  StudyHelperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StudyHelperTests
    dependencies:
      - target: StudyHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: MiloG.StudyHelperTests1
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES

  StudyHelperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StudyHelperUITests
    dependencies:
      - target: StudyHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: MiloG.StudyHelperUITests1
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StudyHelper

schemes:
  StudyHelper:
    build:
      targets:
        StudyHelper: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - StudyHelper
      targets:
        - name: StudyHelperTests
        - name: StudyHelperUITests
    archive:
      config: Release
